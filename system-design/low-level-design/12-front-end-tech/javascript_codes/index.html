<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basics Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
        }

        #output {
            margin-top: 20px;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 8px;
        }

        /* ── To-Do List ── */
        #todo-section {
            margin-top: 40px;
            border-top: 2px solid #ddd;
            padding-top: 20px;
        }

        #todo-section h2 {
            margin-bottom: 12px;
        }

        #todo-input-row {
            display: flex;
            gap: 8px;
        }

        #todo-input {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #add-todo-btn {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 14px;
        }

        #add-todo-btn:hover { background: #45a049; }

        #todo-list {
            list-style: none;
            padding: 0;
            margin-top: 14px;
        }

        #todo-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            gap: 10px;
        }

        #todo-list li.done .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-text {
            flex: 1;
            cursor: pointer;
            font-size: 15px;
        }

        .todo-actions {
            display: flex;
            gap: 6px;
        }

        .done-btn {
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .done-btn:hover { background: #1976D2; }

        .delete-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover { background: #d32f2f; }

        #todo-stats {
            margin-top: 10px;
            font-size: 13px;
            color: #555;
        }

        #clear-done-btn {
            margin-top: 10px;
            background: #9e9e9e;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
        }

        #clear-done-btn:hover { background: #757575; }
    </style>
</head>

<body>

<h1>JavaScript Demo</h1>

<p id="message">Click the button below.</p>

<button id="btn">Run JavaScript</button>

<div id="output"></div>

<!-- ── To-Do List ── -->
<section id="todo-section">
    <h2>To-Do List</h2>

    <div id="todo-input-row">
        <input type="text" id="todo-input" placeholder="Add a new task..." maxlength="100">
        <button id="add-todo-btn">Add</button>
    </div>

    <ul id="todo-list"></ul>

    <div id="todo-stats"></div>
    <button id="clear-done-btn">Clear Completed</button>
</section>

<script src="scripts.js"></script>

</body>
</html>
